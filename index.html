<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recomp Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recomp"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#11112A">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">

<style>
/* Layout: phone-style app shell, one column up to 560px, bottom tab bar. Week strip on top, cards below. */
:root{--m1:#AFCFD2;--n1:#C6E3DD;--m2:#80BAB4;--n2:#95CAC0;--m3:#49A293;--n3:#5AAD9C;
  --bg:#F3F2FA; --surface:#FFFFFF; --surface2:#ECEAF7; --line:#DDDAEE;
  --fg:#1A1830; --mute:#6B6888; --accent:#5B45D6; --accent-fg:#FFFFFF;
  --good:#138A72; --warn:#B7791F; --bad:#C2255C;
  --f-display:'Sora','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--m1:#2C5968;--n1:#234956;--m2:#32817E;--n2:#2A726F;--m3:#37AE97;--n3:#33A28D;
    --bg:#11112A; --surface:#1B1B3A; --surface2:#26264C; --line:#2F2F5A;
    --fg:#EDEBFF; --mute:#9D9BC8; --accent:#8B7BFF; --accent-fg:#14123A;
    --good:#3DDCB0; --warn:#FFC24D; --bad:#FF6FA3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{--m1:#2C5968;--n1:#234956;--m2:#32817E;--n2:#2A726F;--m3:#37AE97;--n3:#33A28D;
  --bg:#11112A; --surface:#1B1B3A; --surface2:#26264C; --line:#2F2F5A;
  --fg:#EDEBFF; --mute:#9D9BC8; --accent:#8B7BFF; --accent-fg:#14123A;
  --good:#3DDCB0; --warn:#FFC24D; --bad:#FF6FA3; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:560px;margin:0 auto;padding-left:16px;padding-right:16px;padding-top:12px;padding-bottom:110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px;padding-bottom:12px}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)} .sync.busy i{background:var(--warn)}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.card h2{font-size:15px;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.card h2 small{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--mute)}
.mute{color:var(--mute)} .num{font-variant-numeric:tabular-nums}
/* day header */
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead .txt{flex:1;min-width:0}
.dow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.date{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15}
.sub{font-size:13px;color:var(--mute);margin-top:2px}
.navb{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.navb svg{width:18px;height:18px}
.tbtn{height:30px;padding-left:12px;padding-right:12px;border-radius:15px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:13px}
.ring{position:relative;width:68px;height:68px;flex:none}
.ring svg{width:68px;height:68px;transform:rotate(-90deg)}
.ring .tr{stroke:var(--surface2)} .ring .fg{stroke:var(--good);transition:stroke-dashoffset .3s}
.ring b{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-family:var(--f-display);font-size:15px}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;padding-bottom:8px;border-radius:14px;border:1px solid transparent;background:var(--surface)}
.wd span{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.04em}
.wd b{font-family:var(--f-display);font-size:15px}
.wd.sel{border-color:var(--accent);background:var(--surface2)}
.wd.today b{color:var(--accent)}
.mini{position:relative;width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--surface2) 0)}
.wd.sel .mini{background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0)}
.mini::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.wd.sel .mini::after{background:var(--surface2)}
/* habits */
.habit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;background:var(--surface2);margin-bottom:8px;min-height:46px}
.habit:last-child{margin-bottom:0}
.habit .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--mute);display:grid;place-items:center;flex:none}
.habit .box svg{width:14px;height:14px;opacity:0;stroke:var(--accent-fg)}
.habit.on .box{background:var(--good);border-color:var(--good)}
.habit.on .box svg{opacity:1}
.habit.on .nm{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.habit .nm{flex:1;min-width:0}
/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface2);border-radius:14px;padding:10px 10px 12px;min-width:0}
.tile .l{font-size:12px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;gap:4px}
.tile .row{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;margin-top:6px}
.tile input{width:100%;min-width:0;background:transparent;border:0;text-align:center;font-family:var(--f-display);font-size:20px;font-weight:600;padding:2px 0}
.tile input::placeholder{color:var(--line)}
.stp{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:18px;line-height:1;flex:none;display:grid;place-items:center}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s}
.bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding-left:14px;padding-right:14px;border-radius:17px;background:var(--surface2);border:1px solid transparent;font-weight:600;font-size:13.5px}
.chip.sel{background:var(--accent);color:var(--accent-fg)}
.chip.sug:not(.sel){border:1px dashed var(--accent)}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px}
/* exercises */
.ex{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.exhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;background:var(--surface2)}
.exhead .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.exhead .tg{font-size:12.5px;color:var(--mute);margin-top:1px;font-weight:500}
.exhead .st{font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.exhead .st.full{color:var(--good)}
.exbody{padding:10px 12px 12px}
.last{font-size:12.5px;color:var(--mute);margin-bottom:8px}
.badge{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:9px;background:var(--warn);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.03em;vertical-align:middle}
.set{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.set .i{font-size:12px;color:var(--mute);text-align:center;font-weight:700}
.fld{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:10px;padding-left:10px;padding-right:10px;height:40px;min-width:0}
.fld input{width:100%;min-width:0;background:transparent;border:0;font-family:var(--f-display);font-weight:600;font-size:16px;text-align:right;padding:0}
.fld span{font-size:12px;color:var(--mute);flex:none}
.set:not(.done) .fld input{color:var(--mute)}
.ok{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center}
.ok svg{width:18px;height:18px;opacity:.35;stroke:var(--fg)}
.set.done .ok{background:var(--good);border-color:var(--good)}
.set.done .ok svg{opacity:1;stroke:var(--accent-fg)}
.link{color:var(--accent);font-weight:600;font-size:13.5px;padding-top:6px;padding-bottom:6px}
.vol{font-size:12.5px;color:var(--mute);margin-top:2px}
textarea.note{width:100%;min-height:76px;resize:vertical;background:var(--surface2);border:0;border-radius:12px;padding:12px}
/* calendar */
.ystrip{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ystrip h1{font-size:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:19px}
.stat span{font-size:11px;color:var(--mute);font-weight:600}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:12px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.month h3{font-size:14px;margin-bottom:6px}
.month h3 .mt{font:inherit;color:var(--accent);padding:2px 0}
.month{padding:8px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid7 .h{font-size:9.5px;text-align:center;color:var(--mute);font-weight:700}
.cd{aspect-ratio:1;border-radius:7px;font-size:11px;font-weight:600;display:grid;place-items:center;background:var(--surface2);color:var(--mute);min-width:0}
.cd.e{background:transparent}
.cd.l1{background:var(--m1);color:var(--fg)}
.cd.l2{background:var(--m2);color:var(--fg)}
.cd.l3{background:var(--m3);color:var(--fg)}
.cd.l4{background:var(--good);color:var(--accent-fg);font-weight:700}
.cd.t{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-top:12px;flex-wrap:wrap}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block}
/* progress */
.big{font-family:var(--f-display);font-size:28px;font-weight:700}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.kv div span{display:block;font-size:12px;color:var(--mute);font-weight:600}
.kv div b{font-family:var(--f-display);font-size:19px}
svg.ch{width:100%;height:auto;display:block}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .ax{fill:var(--mute);font-size:10px;font-family:var(--f-body)}
.ch .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars .b i{width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bars .b span{font-size:10.5px;color:var(--mute)} .bars .b em{font-style:normal;font-size:11px;font-weight:700}
select.sel{width:100%;height:42px;border-radius:12px;background:var(--surface2);border:0;padding-left:12px;padding-right:12px;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
.tbl th{font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;border-top:0}
.tbl td.r,.tbl th.r{text-align:right}
.empty{padding:22px 8px;text-align:center;color:var(--mute);font-size:13.5px}
/* settings */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.field label{font-weight:500}
.inp{height:40px;border-radius:10px;background:var(--surface2);border:0;padding-left:12px;padding-right:12px;min-width:0}
.inp.sm{width:64px;text-align:center;padding-left:4px;padding-right:4px}
.inp.w{flex:1}
.exrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.x{width:34px;height:34px;border-radius:10px;color:var(--bad);font-size:20px;flex:none}
.btn{height:40px;padding-left:16px;padding-right:16px;border-radius:12px;background:var(--surface2);font-weight:600}
.btn.p{background:var(--accent);color:var(--accent-fg)}
.btn.d{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea.bk{width:100%;min-height:80px;background:var(--surface2);border:0;border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,monospace}
/* workout editing */
.chip.add{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
.exact{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.mini-btn{height:34px;padding-left:12px;padding-right:12px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:13px}
.mini-btn.del{color:var(--bad)} .mini-btn:disabled{opacity:.4;cursor:default}
.btn.addex{width:100%;margin-top:12px;border:1px dashed var(--mute);background:transparent}
.removed{font-size:12.5px;color:var(--mute);margin-top:10px}
.removed .link{display:inline;padding:0 6px}
.sheet-bg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(8,8,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:82%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-top h2{font-size:17px}
.keep{display:flex;gap:8px;align-items:center;margin-top:10px;margin-bottom:10px;font-size:13.5px}
.keep input{width:18px;height:18px;accent-color:var(--accent)}
.pitem{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.pitem.new{color:var(--accent);font-weight:700}
/* month calendar */
.kc .seg{margin-bottom:10px}
.kc .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.kc .nav b{font-family:var(--f-display);font-size:15px}
.kc .navb[disabled]{opacity:.35;cursor:default}
.ch .kb{fill:var(--accent);opacity:.55}.ch .kb.good{fill:var(--good);opacity:1}.ch .kb.warn{fill:var(--warn);opacity:1}
.ch .goal{stroke:var(--mute);stroke-width:1.2;stroke-dasharray:4 3}
.ch .val{fill:var(--fg);font-size:9px;font-family:var(--f-body);font-weight:600}
.kc .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.kc .lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.kc .sum{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.kc .sum h3{font-family:var(--f-display);font-size:15px;margin:0 0 10px}
.kc .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.kc .rings svg{width:100%;max-width:104px;height:auto;display:block;margin:0 auto}
.kc .rings .t{fill:none;stroke:var(--surface2);stroke-width:11}
.kc .rings .p{fill:none;stroke-width:11;stroke-linecap:round}
.kc .rings .n{fill:var(--fg);font-family:var(--f-display);font-weight:700;font-size:17px}
.kc .rings .u{fill:var(--mute);font-size:10px;font-family:var(--f-body)}
.kc .rings span{display:block;font-size:12.5px;color:var(--mute);margin-top:4px;font-weight:600}
.kc .tg{margin-top:16px}
.kc .tg .r{margin-bottom:11px}
.kc .tg .r div{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.kc .tg .r div b{font-weight:600}.kc .tg .r div em{font-style:normal;color:var(--mute)}
.kc .tg .tr{height:8px;border-radius:6px;background:var(--surface2);margin-top:5px;overflow:hidden}
.kc .tg .tr i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.kc .tg .tr i.good{background:var(--good)}.kc .tg .tr i.warn{background:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{height:34px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mh{font-size:11px;text-align:center;color:var(--mute);font-weight:700;letter-spacing:.03em;padding-top:2px;padding-bottom:2px}
.mc{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:62px;padding:7px 2px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.mc.e{background:transparent;border-color:transparent}
.mc .n{font-family:var(--f-display);font-weight:600;font-size:15px}
.mc .tag{font-size:10.5px;font-weight:700;color:var(--mute);min-height:13px}
.mc.l1{background:var(--n1)}
.mc.l2{background:var(--n2)}
.mc.l3{background:var(--n3)}
.mc.l4{background:var(--good);border-color:var(--good)}
.mc.l4 .n,.mc.l4 .tag{color:var(--accent-fg)}
.mc.t{outline:2px solid var(--accent);outline-offset:1px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px;gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;padding-bottom:6px;border-radius:12px;color:var(--mute);font-size:11px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.nogap .top>*+*{margin-left:12px}
.nogap .sync>*+*{margin-left:6px}
.nogap .card h2>*+*{margin-left:8px}
.nogap /* day header */
.dayhead>*+*{margin-left:12px}
.nogap .wd>*+*{margin-top:4px}
.nogap /* habits */
.habit>*+*{margin-left:12px}
.nogap .tile .l>*+*{margin-left:4px}
.nogap .tile .row>*+*{margin-left:4px}
.nogap /* chips */
.chips>*{margin:0 8px 8px 0}
.nogap .exhead>*+*{margin-left:10px}
.nogap .fld>*+*{margin-left:6px}
.nogap /* calendar */
.ystrip>*+*{margin-left:10px}
.nogap .legend>*{margin:0 6px 6px 0}
.nogap .kv>*{margin:0 18px 18px 0}
.nogap .bars>*+*{margin-left:8px}
.nogap .bars .b>*+*{margin-top:4px}
.nogap /* settings */
.field>*+*{margin-left:12px}
.nogap .exrow>*+*{margin-left:6px}
.nogap .row>*{margin:0 8px 8px 0}
.nogap .exact>*{margin:0 8px 8px 0}
.nogap .keep>*+*{margin-left:8px}
